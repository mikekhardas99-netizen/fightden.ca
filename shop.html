body
{
    margin: 0 0 0 0;
    padding: 0 0 0 0;
}
.nav
{
    margin: 0 0 0 0;
    padding: 0 0 0 0;
}
.title
{
    padding-left: 5px;
}
.flex-container {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 30px;
    align-items: center;
    justify-content: center;
}
.card
{
    display: flex;
    flex-direction: column;
    min-width: 300px;
    width: 300px;
    height: 500px;
    align-items: center;
    background-color: rgb(221 221 221 / 90%);
    margin-bottom: 10px;
    padding: 5px;
    box-shadow: 4px 4px 15px black;
    color: #000000;
}
.cart
{
    background-color: #000000;
    color: white;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
}
.cardimage
{
    width: 300px;
    height: 600px;
    object-fit: cover;
    /* object-position: center 20%; Shifts crop vertically */
}
.shop-item-grid-container {
    display: grid;
    grid-template-rows: auto 20px 30px 50px;
    gap: 0px;
    justify-content: center;
    height: 100%;
}
.shop-item-row
{
    align-items: start;
    padding-top: 5px;
    /* border: 1px solid #000000; */
}
.last-shop-item-card {
    align-content: end;
    justify-content: center;
    /* border: 1px solid #000000; */
}

    </div>
   </div>
   <div class="card">
    <img src="images/shop/digital_products.webp" alt="" class="cardimage">
    <div class="shop-item-grid-container">

      <div>Home based video tutorial</div>
      <div class="shop-item-row">$75.00</div>
      <div class="last-shop-item-card"><button class="cart">ADD TO CART</button></div>
    </div>
   </div>
   <div class="card">

    <div class="shop-item-grid-container">
      <div class="bold">VIP KRAV BRANDED T-SHIRT</div>
      <div>Available in various sizes</div>
      <div class="shop-item-row">$30.00</div>
      <div class="last-shop-item-card"><button class="cart">ADD TO CART</button></div>
    </div>
   </div>
